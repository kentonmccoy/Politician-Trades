name: Update data
on:
  schedule: [{cron: "0 13 * * 1-5"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
      - run: |
          git config user.name "data-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data.json; git commit -m "Update data" || exit 0; git push
