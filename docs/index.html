<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitol Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#FFFFFF;--ink:#14213D;--mute:#5B6784;--line:#DCE3EF;--acc:#2B59C3;--buy:#1F8A5B;--sell:#C23B3B;--hot:#E8A33D;--tint:#E9EFFB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162A;--card:#192040;--ink:#EAF0FF;--mute:#9AA6C6;--line:#2A3459;--acc:#7DA2FF;--buy:#4CC38A;--sell:#F07A7A;--hot:#F0B85A;--tint:#222B52}}
:root[data-theme="dark"]{--bg:#10162A;--card:#192040;--ink:#EAF0FF;--mute:#9AA6C6;--line:#2A3459;--acc:#7DA2FF;--buy:#4CC38A;--sell:#F07A7A;--hot:#F0B85A;--tint:#222B52}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;line-height:1.05;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 14px}
.banner{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:16px}
.tabs{display:flex;gap:6px;background:var(--tint);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:600 .95rem inherit;font-family:inherit;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.15)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.row{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:14px;cursor:pointer}
.tick{font-weight:800;font-size:1.15rem;min-width:56px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600}
.meta span{color:var(--mute);font-size:.85rem}
.tag{font-weight:800;font-size:.8rem;padding:3px 9px;border-radius:99px}
.buy{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}
.sell{background:color-mix(in srgb,var(--sell) 18%,transparent);color:var(--sell)}
.both{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:600;color:var(--hot)}
.detail{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.item.open .detail{display:block}
.detail h3{font-size:.9rem;margin:14px 0 2px}
.detail p{margin:0;font-size:.95rem}
.bar{height:8px;border-radius:6px;background:var(--tint);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hot)}
.mult{font-weight:800;font-size:1.1rem;color:var(--hot)}
.fine{font-size:.78rem;color:var(--mute);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Capitol Guide</h1>
<p class="sub">What politicians are trading, in plain English.</p>
<div class="banner" id="banner">Loading…</div>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Politician trades</button>
<button role="tab" id="t2" aria-selected="false">Busy stocks today</button>
</div>
<div id="list"></div>
<p class="fine">For education only, not financial advice. Politicians can file trades up to 45 days after they happen, so this data is always behind. A disclosed trade doesn’t show why it was made.</p>
</main>
<script>
var STOCKS={},TRADES=[],VOL=[],traded={};
var list=document.getElementById("list"),tabs=[document.getElementById("t1"),document.getElementById("t2")];
function detail(tk,extra){var s=STOCKS[tk];return '<div class="detail">'+(extra||"")+'<h3>What the company does</h3><p>'+s.does+'</p><h3>Why it may be active</h3><p>'+s.why+'</p><h3>Things to weigh</h3><p>'+s.weigh+'</p></div>'}
function item(inner,tk,extra){var d=document.createElement("div");d.className="item";d.innerHTML='<button class="row" aria-expanded="false">'+inner+'</button>'+detail(tk,extra);
d.querySelector(".row").onclick=function(){var o=d.classList.toggle("open");this.setAttribute("aria-expanded",o)};return d}
function show(n){tabs.forEach(function(b,i){b.setAttribute("aria-selected",i==n)});list.innerHTML="";
if(n==0){TRADES.forEach(function(r){var busy=VOL.some(function(v){return v.t==r.t});
list.appendChild(item('<span class="tick">'+r.t+'</span><span class="meta"><b>'+r.who+'</b><span>'+r.size+' · '+r.date+'</span>'+(busy?'<span class="both">Also unusually busy today</span>':'')+'</span><span class="tag '+r.side.toLowerCase()+'">'+r.side+'</span>',r.t))})}
else{VOL.forEach(function(v){var r=traded[v.t];
list.appendChild(item('<span class="tick">'+v.t+'</span><span class="meta"><span class="mult">'+v.x+'× normal volume</span><div class="bar"><i style="width:'+Math.min(100,v.x/4*100)+'%"></i></div>'+(r?'<span class="both">A politician also traded this</span>':'')+'</span>',v.t,r?'<h3>Politician activity</h3><p>'+r.who+' reported a '+r.side.toLowerCase()+' ('+r.size+') on '+r.date+'.</p>':''))})}}
tabs[0].onclick=function(){show(0)};tabs[1].onclick=function(){show(1)};
fetch("data.json").then(function(r){return r.json()}).then(function(d){
STOCKS=d.stocks;TRADES=d.trades;VOL=d.vol;TRADES.forEach(function(r){if(!traded[r.t])traded[r.t]=r});
document.getElementById("banner").innerHTML=d.sample?"<b>Sample data.</b> Made-up numbers that show the design.":"<b>Updated "+d.updated+".</b> Trades come from House Clerk filings.";
show(0)}).catch(function(){list.innerHTML="<p>Couldn’t load data.json. Run the pipeline first.</p>"});
</script>
</body>
</html>
